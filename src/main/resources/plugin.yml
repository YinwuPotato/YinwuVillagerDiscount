# 注意：本模块走 Van 约定（不用 Maven），resources 是原样打包的，
#       所以下面必须写死真实值 —— 不能用 Maven 的美元花括号占位符，
#       否则 Bukkit 会因为插件名含非法字符而拒绝加载。
name: YinwuVillagerDiscount
version: '1.0.0'
main: org.yinwu.villagerdiscount.YinwuVillagerDiscountPlugin
api-version: '1.21'
description: 共享村民折扣：任何人治愈僵尸村民后，全服玩家都享受那份折扣（移植 totos-carpet-tweaks 的 sharedVillagerDiscounts，Folia 兼容）
author: Qumingjam
website: server.yinwurealm.org

# Folia 兼容 - 使用区域线程调度
folia-supported: true

commands:
  yinwuvillagerdiscount:
    description: 共享村民折扣主命令
    usage: /yinwuvillagerdiscount <help|info|reload>
    aliases: [yvd]
    permission: yinwu.villagerdiscount.use

permissions:
  yinwu.villagerdiscount.use:
    description: 使用 /yvd 基础命令
    default: true
  yinwu.villagerdiscount.admin:
    description: 管理操作（info / reload）
    default: op
